<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Sócios | Merkos Intelligence</title>
    <link rel="icon" type="image/png" href="/Logos/merkos_símbolo_azul.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --merkos-red: #185FED;
            --merkos-red-dark: #0F47B8;
            --merkos-red-deep: #0A1F42;
            --merkos-green: #54E25B;
            --bg-body: #f5f7ef;
            --bg-card: #ffffff;
            --text-main: #3C3C3C;
            --text-muted: #9C9C9C;
            --text-light: #D0D0D0;
            --border: #E8E8E8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
        }

        header {
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        header img {
            max-width: 140px;
            height: auto;
        }

        .content-container {
            padding: 2.5rem;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: var(--bg-card);
            border-radius: 1.25rem;
            border: 1px solid var(--border);
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 2.5rem;
        }

        .card-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--merkos-red-deep);
        }

        textarea {
            width: 100%;
            padding: 0.875rem 1.125rem;
            border: 1.5px solid var(--border);
            border-radius: 0.875rem;
            font-size: 0.95rem;
            color: var(--text-main);
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
            height: 140px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--merkos-red);
            box-shadow: 0 0 0 4px rgba(24, 95, 237, 0.08);
        }

        .primary-button {
            background-color: var(--merkos-red);
            color: #ffffff;
            padding: 1rem 2rem;
            border: none;
            border-radius: 0.875rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .primary-button:hover {
            background-color: var(--merkos-red-dark);
            transform: translateY(-2px);
        }

        .primary-button:disabled {
            background-color: var(--text-light);
            cursor: not-allowed;
            transform: none;
        }

        .secondary-btn {
            background: #f1f5f9;
            color: var(--text-main);
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .table-wrap {
            border-radius: 1rem;
            border: 1px solid var(--border);
            overflow: hidden;
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #f8fafc;
            border-bottom: 2px solid var(--border);
        }

        th {
            padding: 1rem 1.25rem;
            font-size: 0.8125rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
        }

        td {
            padding: 1rem 1.25rem;
            font-size: 0.9375rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .chip {
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .chip-green {
            background: #dcfce7;
            color: #15803d;
        }

        .chip-red {
            background: #dbeafe;
            color: var(--merkos-red);
        }

        .chip-gray {
            background: #f3f4f6;
            color: var(--text-muted);
        }

        .loading-cover {
            display: none;
            padding: 4rem;
            text-align: center;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--merkos-red);
            border-radius: 50%;
            animation: spin-anim 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin-anim {
            to {
                transform: rotate(360deg);
            }
        }

        .deep-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
        }

        .partner-box {
            padding: 1rem;
            background: #fcfcfc;
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            border-left: 5px solid var(--border);
        }

        .partner-box.active {
            border-left-color: var(--merkos-green);
        }

        .partner-box.old {
            border-left-color: #F1BD4E;
        }

        .wa-contact {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.875rem;
            margin-top: 4px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <header>
        <img src="/Logos/merkos_cor_horizontal_azul.png" alt="Merkos Logo">
        <button onclick="logout()" class="secondary-btn">Sair</button>
    </header>

    <div class="content-container">
        <div class="card" style="text-align: center;">
            <div class="card-title">Busca de Sócios</div>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Acesso aos contatos e histórico dos sócios.</p>

            <textarea id="cnpjs-deep" placeholder="CNPJs (Um por linha)"></textarea>

            <div style="margin-top: 1.5rem; display: flex; justify-content: center; align-items: center; gap: 2rem;">
                <button id="btn-deep-search" class="primary-button" onclick="searchDeep()">BUSCAR CONTATOS
                    LIVE</button>
                <div id="deep-counter" class="chip chip-gray">00 / 00 Processados</div>
            </div>
        </div>

        <div id="deep-loading" class="loading-cover">
            <div class="loader"></div>
            <p>Consultando base BigData Corp Live...</p>
        </div>

        <div id="deep-results-section" style="display: none;">
            <div class="card-header">
                <h3>Contatos Encontrados</h3>
                <button onclick="exportDeepCSV()" class="primary-button"
                    style="padding: 0.6rem 1.5rem; background: var(--merkos-green);">DOWNLOAD CSV</button>
            </div>

            <div class="table-wrap" style="margin-bottom: 3rem;">
                <table>
                    <thead>
                        <tr>
                            <th>Empresa Master</th>
                            <th>Estrutura Societária</th>
                            <th>WhatsApp / Live Phones</th>
                        </tr>
                    </thead>
                    <tbody id="deep-table-body"></tbody>
                </table>
            </div>

            <h3 style="margin-bottom: 1.5rem;">Visualização Detalhada</h3>
            <div id="deep-cards-grid" class="deep-grid"></div>
        </div>
    </div>

    <script src="deep_search.js"></script>
    <script>
        function logout() {
            fetch('/api/logout', { method: 'POST' }).then(() => window.location.href = '/login.html');
        }
    </script>
</body>

</html>
